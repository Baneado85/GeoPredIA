applications:
  - name: geopredia-ac374882u14
    memory: 512M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: python -m uvicorn agents.api:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    health-check-type: process
    timeout: 180
    env:
      SEED_DEMO: "false"
      SEED_OFFICIAL_DATASET: "true"
      GEOPREDIA_ALLOWED_HOSTS: "*.cfapps.us10.hana.ondemand.com,*.cfapps.us10-001.hana.ondemand.com"
      LLM_ENABLED: "false"
      ALLOW_PUBLIC_DEMO: "true"
      GEOPREDIA_CORS_ORIGINS: "https://georisk-app-ac374882u14.cfapps.us10-001.hana.ondemand.com,http://localhost:3000,http://localhost:8080"
    services:
      - geopredia-hdi
